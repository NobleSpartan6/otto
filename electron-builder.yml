appId: ai.otto.desktop
productName: Otto
directories:
  output: release
files:
  - dist/**/*
  - dist-desktop/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/**/*
mac:
  # Ad-hoc integrity signing is required even without a Developer ID certificate.
  # This does not make the alpha notarized or publisher-verified.
  identity: "-"
  binaries:
    - Contents/Resources/native/otto-ax
    - Contents/Resources/native/otto-voice
  icon: desktop/icons/otto.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  extendInfo:
    NSAccessibilityUsageDescription: Otto uses accessibility to observe and act in apps you explicitly select.
    NSScreenCaptureUsageDescription: Otto shows the selected app window so you can review each action.
    NSMicrophoneUsageDescription: Otto listens only when you start dictation, to draft a task for your review.
    NSSpeechRecognitionUsageDescription: Otto uses on-device speech recognition to draft your task. Audio is not saved.
  extraResources:
    - from: desktop/native/macos/otto-ax
      to: native/otto-ax
    - from: desktop/native/macos/otto-voice
      to: native/otto-voice
win:
  icon: desktop/icons/otto.ico
  target:
    - nsis
  extraResources:
    - from: desktop/native/windows/otto-uia.ps1
      to: native/otto-uia.ps1
    - from: desktop/native/windows/otto-voice.ps1
      to: native/otto-voice.ps1
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: NobleSpartan6
  repo: otto
