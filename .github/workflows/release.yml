name: Unsigned alpha installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish as an unsigned prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OTTO_BUILD_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify version tag
        run: node .github/scripts/check-release-tag.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read-only native protocol smoke
        run: node .github/scripts/native-smoke.mjs
        timeout-minutes: 2
      - name: Package unsigned alpha
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          npx electron-builder --"$BUILD_PLATFORM" --"$BUILD_ARCH"
          --publish never
          '-c.artifactName=Otto-${version}-${os}-${arch}.${ext}'
      - name: Verify macOS bundle integrity
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            codesign --verify --deep --strict --verbose=2 release/mac-arm64/Otto.app
          else
            codesign --verify --deep --strict --verbose=2 release/mac/Otto.app
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

  publish:
    name: Publish unsigned prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: unsigned-*
          path: artifacts
          merge-multiple: true
      - run: node .github/scripts/publish-alpha.mjs
